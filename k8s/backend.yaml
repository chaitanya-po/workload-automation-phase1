apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workload-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: workload-backend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_PASSWORD
              value: admin
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"


---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: workload-automation
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP